name: studyrag

services:
  # ---Infrastructure
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---Local LLM: only started with  docker compose --profile local-llm up
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes: ["ollama_data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]

  # ---Application services
  embedding:
    build: ./services/embedding
    env_file: .env
    ports: ["8002:8000"]
    volumes: ["hf_cache:/root/.cache/huggingface"]

  ingestion:
    build: ./services/ingestion
    env_file: .env
    ports: ["8001:8000"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingestion-worker:
    build: ./services/ingestion
    command: ["python", "worker.py"]
    env_file: .env
    volumes:
      - "uploads:/data/uploads"
      - "hf_cache:/root/.cache/huggingface"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      embedding:
        condition: service_started

  retrieval:
    build: ./services/retrieval
    env_file: .env
    ports: ["8003:8000"]
    depends_on:
      - qdrant
      - embedding
      - redis

  llm-gateway:
    build: ./services/llm-gateway
    env_file: .env
    ports: ["8004:8000"]

  gateway:
    build: ./services/gateway
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      - retrieval
      - llm-gateway
      - redis

  ui:
    build: ./services/ui
    ports: ["3000:80"]
    depends_on:
      - gateway

volumes:
  qdrant_data:
  ollama_data:
  hf_cache:
  uploads: